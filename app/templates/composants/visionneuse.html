{#- Visionneuse photo plein écran, pilotée par static/js/visionneuse.js. À inclure une fois par page. -#}
{% from "composants/ui.html" import icone %}
<dialog class="visionneuse" id="visionneuse" aria-label="Visionneuse de photos">
  <div class="flex h-full flex-col lg:flex-row">
    <div class="relative flex min-h-0 flex-1 touch-pan-y items-center justify-center p-2" data-zone-image>
      <img class="max-h-full max-w-full object-contain select-none" alt="" draggable="false">
      <p class="absolute top-4 left-4 rounded-full bg-white/10 px-2.5 py-1 text-libelle tabular-nums" data-position aria-live="polite"></p>
      <button type="button" class="absolute top-3 right-3 grid size-11 place-items-center rounded-full bg-white/10 transition-colors duration-150 hover:bg-white/20" data-fermer aria-label="Fermer">{{ icone("x", 22) }}</button>
      <button type="button" class="absolute top-1/2 left-2 grid size-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 transition-colors duration-150 hover:bg-white/20" data-pas="-1" aria-label="Photo précédente">{{ icone("chevron-left", 24) }}</button>
      <button type="button" class="absolute top-1/2 right-2 grid size-11 -translate-y-1/2 place-items-center rounded-full bg-white/10 transition-colors duration-150 hover:bg-white/20" data-pas="1" aria-label="Photo suivante">{{ icone("chevron-right", 24) }}</button>
    </div>
    <aside class="max-h-[42%] shrink-0 overflow-y-auto border-t border-white/10 p-5 lg:max-h-none lg:w-80 lg:border-t-0 lg:border-l">
      <div data-infos></div>
      <button type="button" class="mt-5 inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-lg bg-white px-4 font-medium text-texte transition-colors duration-150 hover:bg-neutre-fond" data-voir-carte>
        {{ icone("map-pin", 18) }} Voir sur la carte
      </button>
    </aside>
  </div>
</dialog>
